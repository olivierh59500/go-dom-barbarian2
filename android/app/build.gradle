plugins {
    id "com.android.application"
}

android {
    namespace "com.olivierh.dombarbarian2"
    compileSdk 36

    defaultConfig {
        applicationId "com.olivierh.dombarbarian2"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "0.1.1"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files("libs/libdombarbarian2.aar")
}
